<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<header class="site-header" th:fragment="header">
    <a class="brand" th:href="@{/members}">Study Member</a>
    <nav>
        <a th:href="@{/members}">회원 관리</a>
        <a th:if="${isMaster}" th:href="@{/admin/roles}">권한 관리</a>
    </nav>
    <div class="account">
        <details class="account-menu">
            <summary th:text="|${loginName}님|">사용자</summary>
            <div class="account-menu-panel">
                <button class="account-menu-button" type="button" data-open-password-modal>비밀번호 변경</button>
                <button class="account-menu-button" type="button" data-open-logout-modal>로그아웃</button>
            </div>
        </details>
    </div>
    <div class="modal-backdrop" id="password-modal" th:classappend="${passwordError != null} ? ' open'" aria-hidden="true">
        <section class="modal" role="dialog" aria-modal="true" aria-labelledby="header-password-modal-title">
            <div class="modal-header"><h2 id="header-password-modal-title">비밀번호 변경</h2><button type="button" class="modal-close" data-close-password-modal aria-label="닫기">×</button></div>
            <div class="alert error" th:if="${passwordError}" th:text="${passwordError}"></div>
            <form th:action="@{/account/password/change}" method="post" class="stack-form">
                <label>현재 비밀번호<input type="password" name="currentPassword" autocomplete="current-password" required></label>
                <label>새 비밀번호<input type="password" name="newPassword" minlength="8" maxlength="72" autocomplete="new-password" required></label>
                <label>새 비밀번호 확인<input type="password" name="newPasswordConfirm" minlength="8" maxlength="72" autocomplete="new-password" required></label>
                <div class="actions"><button class="button ghost" type="button" data-close-password-modal>취소</button><button class="button primary" type="submit">변경</button></div>
            </form>
        </section>
    </div>
    <div class="modal-backdrop" id="logout-modal" aria-hidden="true">
        <section class="modal confirm-modal" role="dialog" aria-modal="true" aria-labelledby="logout-modal-title">
            <div class="modal-header"><h2 id="logout-modal-title">로그아웃</h2><button type="button" class="modal-close" data-close-logout-modal aria-label="닫기">×</button></div>
            <p class="confirm-message">정말 로그아웃하시겠습니까?</p>
            <form th:action="@{/logout}" method="post">
                <div class="actions"><button class="button ghost" type="button" data-close-logout-modal>취소</button><button class="button primary" type="submit">로그아웃</button></div>
            </form>
        </section>
    </div>
</header>
</body>
</html>
