<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>비밀번호 변경</title><link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main class="container narrow">
    <div class="page-title"><div><p class="eyebrow">ACCOUNT</p><h1>비밀번호 변경</h1></div></div>
    <form th:action="@{/password/change}" th:object="${form}" method="post" class="panel stack-form">
        <div class="alert error" th:if="${#fields.hasGlobalErrors()}" th:each="error : ${#fields.globalErrors()}" th:text="${error}"></div>
        <label>현재 비밀번호<input type="password" th:field="*{currentPassword}" required></label>
        <small class="field-error" th:errors="*{currentPassword}"></small>
        <label>새 비밀번호<input type="password" th:field="*{newPassword}" required></label>
        <small class="field-error" th:errors="*{newPassword}"></small>
        <label>새 비밀번호 확인<input type="password" th:field="*{newPasswordConfirm}" required></label>
        <small class="field-error" th:errors="*{newPasswordConfirm}"></small>
        <div class="actions"><a class="button secondary" th:href="@{/members}">취소</a><button class="button primary" type="submit">변경</button></div>
    </form>
</main>
</body>
</html>
