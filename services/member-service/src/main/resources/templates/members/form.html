<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>회원 등록</title><link rel="stylesheet" th:href="@{/css/app.css}"><link rel="stylesheet" th:href="@{/css/modal.css}"><link rel="stylesheet" th:href="@{/css/member-form.css}"></head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main class="container narrow">
    <div class="page-title"><div><h1>회원 등록</h1></div></div>
    <form th:action="@{/members}" th:object="${form}" method="post" class="panel stack-form">
        <div class="alert error" th:if="${#fields.hasGlobalErrors()}" th:each="error : ${#fields.globalErrors()}" th:text="${error}"></div>
        <label>이름 <b>*</b><input type="text" th:field="*{name}" maxlength="100" required></label>
        <small class="field-error" th:errors="*{name}"></small>
        <label>핸드폰 번호 <b>*</b><input type="tel" class="phone-input" th:field="*{phone}" placeholder="010-1234-5678" maxlength="13" inputmode="numeric" required></label>
        <small class="field-error" th:errors="*{phone}"></small>
        <div class="actions"><a class="button secondary" th:href="@{/members}">취소</a><button class="button primary" type="submit">등록</button></div>
    </form>
</main>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
