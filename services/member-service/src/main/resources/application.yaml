spring:
  application:
    name: member-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:15432/memberdb}
    username: ${DB_USERNAME:memberapp}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

  thymeleaf:
    cache: false

app:
  crypto:
    key: ${APP_ENCRYPTION_KEY}

server:
  port: 8081
  servlet:
    context-path: /member

management:
  endpoints:
    web:
      exposure:
        include: health,info
