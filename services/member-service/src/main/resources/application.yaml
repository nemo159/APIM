spring:
  application:
    name: member-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:15432/memberdb}
    username: ${DB_USERNAME:memberapp}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

  thymeleaf:
    cache: false

app:
  crypto:
    key: ${APP_ENCRYPTION_KEY}

server:
  port: 8081
  # Gateway가 전달한 Forwarded/X-Forwarded-* 헤더를 반영하여 리다이렉트 주소를 만든다.
  # 따라서 Gateway로 접속했을 때 로그인 후에도 브라우저 주소는 localhost:8080을 유지한다.
  forward-headers-strategy: framework
  servlet:
    context-path: /member

management:
  endpoints:
    web:
      exposure:
        include: health,info
