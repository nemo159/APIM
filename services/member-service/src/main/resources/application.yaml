spring:
  application:
    name: member-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:15432/memberdb}
    username: ${DB_USERNAME:memberapp}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info