name: study-apim

services:
  member-db:
    image: postgres:17.11-bookworm
    container_name: member-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${MEMBER_DB_NAME}
      POSTGRES_USER: ${MEMBER_DB_USER}
      POSTGRES_PASSWORD: ${MEMBER_DB_PASSWORD}

    ports:
      - "127.0.0.1:15432:5432"

    volumes:
      - member-db-data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 10s
      timeout: 5s
      retries: 10

  work-db:
    image: postgres:17.11-bookworm
    container_name: work-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${WORK_DB_NAME}
      POSTGRES_USER: ${WORK_DB_USER}
      POSTGRES_PASSWORD: ${WORK_DB_PASSWORD}

    ports:
      - "127.0.0.1:15433:5432"

    volumes:
      - work-db-data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  member-db-data:
  work-db-data:
