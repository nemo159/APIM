spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: member-service
              uri: ${MEMBER_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/member/**
              filters:
                # 로그인 성공 후 Location 헤더가 member-service의 8081이 아니라
                # 사용자가 접속한 Gateway의 8080 주소를 유지하도록 원래 Host를 전달한다.
                - PreserveHostHeader
            - id: work-service
              uri: ${WORK_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/work/**

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
